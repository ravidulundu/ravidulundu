  <text x="119" y="74" fill="#A4E6C5" font-family="Consolas, 'Courier New', monospace" font-size="20" letter-spacing="3">SOFTWARE DEVELOPER</text>
  <text x="61" y="204" fill="#F0F1E8" font-family="Segoe UI, Arial, sans-serif" font-size="100" font-weight="650" letter-spacing="-4">Ravi Dulundu<tspan fill="#A4E6C5">.</tspan></text>
  <text x="67" y="270" fill="#F0F1E8" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="400">Web. Desktop. Automation.</text>
  <text x="68" y="321" fill="#A0B5B9" font-family="Segoe UI, Arial, sans-serif" font-size="27">From interface to infrastructure.</text>
  <path d="M67 389H849" stroke="#30454C"/>
  <text x="68" y="431" fill="#A0B5B9" font-family="Consolas, 'Courier New', monospace" font-size="18" letter-spacing="1.5">BRAZIL / @ravidulundu</text>
  <g transform="translate(944 83)">
    <rect width="588" height="334" rx="16" fill="#17272E" stroke="#30454C"/>
