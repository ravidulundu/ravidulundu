<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Ravi Dulundu — Software Developer</title>
  <desc id="desc">A dark editorial banner. Web, desktop and automation, from interface to infrastructure. An illustrated code editor lists these areas of focus.</desc>
  <defs>
